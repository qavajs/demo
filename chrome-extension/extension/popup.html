<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 200px;
      padding: 16px;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
    }
    h3 { margin: 0 0 12px; font-size: 16px; }
    #count { font-size: 48px; font-weight: bold; margin: 12px 0; }
    .buttons { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
    button { padding: 8px 20px; font-size: 18px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; }
    button:hover { background: #e0e0e0; }
    #reset { width: 100%; padding: 6px; font-size: 14px; }
    #status { margin-top: 8px; font-size: 12px; color: #4caf50; min-height: 16px; }
  </style>
</head>
<body>
  <h3>Counter</h3>
  <div id="count">0</div>
  <div class="buttons">
    <button id="decrement">-</button>
    <button id="increment">+</button>
  </div>
  <button id="reset">Reset</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
